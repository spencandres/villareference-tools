<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCO / ECI Fee Calculator</title>

  <style>
    :root {
      --text: #37352f;
      --muted: rgba(55, 53, 47, 0.65);
      --border: rgba(55, 53, 47, 0.16);
      --border-focus: rgba(55, 53, 47, 0.4);
      --background: #ffffff;
      --input-background: #fafafa;
      --result-background: #f7f6f3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: transparent;
      color: var(--text);
      font-family:
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .calculator {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      padding: 22px;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .header {
      margin-bottom: 20px;
    }

    .title {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 5px 0 0;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
    }

    .field {
      margin-bottom: 16px;
    }

    .field:last-of-type {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .input-wrapper {
      position: relative;
    }

    .currency-symbol {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--muted);
      pointer-events: none;
    }

    input {
      width: 100%;
      height: 40px;
      padding: 9px 11px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--input-background);
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
      transition:
        border-color 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    input.currency {
      padding-left: 27px;
    }

    input::placeholder {
      color: rgba(55, 53, 47, 0.35);
    }

    input:hover {
      border-color: rgba(55, 53, 47, 0.25);
    }

    input:focus {
      background: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(55, 53, 47, 0.08);
    }

    /* Remove browser number spinners */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .result {
      padding: 14px 15px;
      background: var(--result-background);
      border-radius: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .result-label {
      font-size: 13px;
      color: var(--muted);
    }

    .result-value {
      font-size: 20px;
      line-height: 1;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
    }

    .formula {
      margin: 12px 2px 0;
      font-size: 11px;
      line-height: 1.4;
      color: rgba(55, 53, 47, 0.5);
      text-align: center;
    }

    @media (max-width: 420px) {
      body {
        padding: 8px;
      }

      .calculator {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="calculator">

    <div class="header">
      <h1 class="title">LCO / ECI Fee Calculator</h1>
      <p class="subtitle">
        Calculate the fee based on the reservation's average nightly rent.
      </p>
    </div>

    <div class="field">
      <label for="totalRent">Total Rent for Reservation</label>

      <div class="input-wrapper">
        <span class="currency-symbol">$</span>
        <input
          type="number"
          id="totalRent"
          class="currency"
          placeholder="2,000"
          min="0"
          step="0.01"
          inputmode="decimal"
          aria-label="Total Rent for Reservation"
        >
      </div>
    </div>

    <div class="field">
      <label for="nights">Number of Nights</label>

      <input
        type="number"
        id="nights"
        placeholder="4"
        min="1"
        step="1"
        inputmode="numeric"
        aria-label="Number of Nights"
      >
    </div>

    <div class="result" aria-live="polite">
      <span class="result-label">LCO / ECI Fee</span>
      <span class="result-value" id="fee">$0.00</span>
    </div>

    <p class="formula">
      50% of the average nightly rent
    </p>

  </main>

  <script>
    const totalRentInput = document.getElementById("totalRent");
    const nightsInput = document.getElementById("nights");
    const feeOutput = document.getElementById("fee");

    function calculateFee() {
      const totalRent = parseFloat(totalRentInput.value) || 0;
      const nights = parseFloat(nightsInput.value) || 0;

      const fee = nights > 0
        ? (totalRent / nights) / 2
        : 0;

      feeOutput.textContent = fee.toLocaleString("en-US", {
        style: "currency",
        currency: "USD",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    totalRentInput.addEventListener("input", calculateFee);
    nightsInput.addEventListener("input", calculateFee);
  </script>

</body>
</html>
